driver: mock
store_ttl_s: 3600.0
store_max_records: 1024
terminal_republish_count: 3
terminal_republish_interval_s: 0.2
shutdown_hold_timeout_s: 2.0
safety_lease:
  watchdog_hz: 10.0
  default_ttl_s: 5.0
  min_ttl_s: 1.0
  max_ttl_s: 30.0
  disarmed_stable_s: 3.0
  required_for_tasks: false
mock:
  result_delay_s: 0.5
  final_success: true
  error_code: ""
  message: mock UAV task finished
  ready: true
  hold_success: true
ego_swarm:
  namespace: /UAV1
  state_timeout_s: 5.0
  position_tolerance_m: 0.2
  arrival_stable_s: 1.0
  pose_timeout_s: 1.0
mavros_position:
  namespace: /mavros
  frame_id: map
  setpoint_rate_hz: 30.0
  pose_timeout_s: 0.5
  state_timeout_s: 1.0
  position_tolerance_m: 0.20
  yaw_tolerance_rad: 0.15
  settle_duration_s: 1.0
  require_connected: true
  require_armed: false
  require_offboard: false
  auto_arm: false
  auto_offboard: false
