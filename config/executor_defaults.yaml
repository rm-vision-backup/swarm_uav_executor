driver: mock
store_ttl_s: 3600.0
store_max_records: 1024
terminal_republish_count: 3
terminal_republish_interval_s: 0.2
shutdown_hold_timeout_s: 2.0
safety_lease:
  watchdog_hz: 10.0
  default_ttl_s: 5.0
  min_ttl_s: 1.0
  max_ttl_s: 30.0
  disarmed_stable_s: 3.0
  required_for_tasks: false
mock:
  result_delay_s: 0.5
  final_success: true
  error_code: ""
  message: mock UAV task finished
  ready: true
  hold_success: true
ego_swarm:
  # 空 namespace = 本机无前缀话题（与 MAVROS /mavros/* 一致，机间靠 bridge 源前缀）
  namespace: ""
  state_timeout_s: 200.0
  position_tolerance_m: 0.2
  arrival_stable_s: 1.0
  pose_timeout_s: 1.0
  # 可选：配置后 END gate 额外要求 MAVROS connected/fresh/stably-disarmed
  mavros_state_topic: ""
  # Follower PI: 位置偏差 PI 控制输出 setpoint 补偿量（按周期换算）
  follower_p_gain: 1.0
  follower_i_gain: 0.1
  follower_limit_xy: 2.0
  follower_limit_z: 1.0
  # 高度分层：MOVE_TO@15m / FOLLOW_ROUTE@12m / FAULT_EXIT@8m
  layer_move_to: 15.0
  layer_follow_route: 12.0
  layer_fault_exit: 8.0
mavros_position:
  namespace: /mavros
  frame_id: map
  setpoint_rate_hz: 30.0
  pose_timeout_s: 0.5
  state_timeout_s: 1.0
  position_tolerance_m: 0.20
  yaw_tolerance_rad: 0.15
  settle_duration_s: 1.0
  require_connected: true
  require_armed: false
  require_offboard: false
  auto_arm: false
  auto_offboard: false
