# EGO-Swarm driver 参数 canonical 默认（implementation_plan_26082916 §5）。
# 加载方式：uav_executor_node 私有 namespace，本文件顶层键为 ego_swarm:，
# rosparam load 后成为 ~/ego_swarm/*（EgoSwarmDriver 读取路径）。
# launch 仅保留 deployment override（neighbor_intents/formation_offsets/
# uav_task_timeout_s/ego_hold_timeout_s 等）。waypoint_densify_spacing
# authoritative 3.0（修 executor_defaults.yaml 2.0 漂移）。
ego_swarm:
  namespace: ''
  task_timeout_s: 200.0
  min_center_distance_m: 1.0
  position_tolerance_m: 0.2
  arrival_stable_s: 1.0
  pose_timeout_s: 1.0
  mavros_state_topic: ''
  follower_p_gain: 1.0
  follower_i_gain: 0.1
  follower_limit_xy: 2.0
  follower_limit_z: 1.0
  layer_move_to: 15.0
  layer_follow_route: 12.0
  layer_fault_exit: 8.0
  layer_tolerance_m: 0.5
  waypoint_densify_spacing: 3.0
  follower_setpoint_topic: /setpoint/follower
  neighbor_intents: ''
  leader_odom_topic_prefix: ''
  neighbor_odom_topics: ''
  formation_offsets: {}
  arm_service: /mavros/cmd/arming
  mode_service: /mavros/set_mode
  origin_confirmed_topic: /gp_origin_confirmed
  configure_px4_params: false
  px4_param_set_timeout_s: 5.0
  com_rcl_except: 4
  nav_rcl_act: 0
